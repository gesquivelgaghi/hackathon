name: Lighthouse a11y

on:
  pull_request:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: lighthouse-a11y-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse-a11y:
    name: Lighthouse Accessibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (with system libs)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Lighthouse CI (builds with --mode audit, serves, audits)
        run: pnpm a11y:ci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-a11y-reports
          path: .lighthouseci
          retention-days: 30
