name: Lighthouse a11y

on:
  pull_request:
    branches: [main, "release/**"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lighthouse-a11y-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse-a11y:
    name: Lighthouse Accessibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (with system libs)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Lighthouse CI (builds with --mode audit, serves, audits)
        run: pnpm a11y:ci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-a11y-reports
          path: .lighthouseci
          retention-days: 30

      - name: Build a11y PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          # The LHCI step is gating today, so the banner reflects that.
          LHCI_MODE: block
          # actions/upload-artifact@v4 doesn't surface an artifact URL output;
          # link to the run page, which lists artifacts.
          LHCI_ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/lighthouse/build-comment.cjs > a11y-comment.md

      - name: Post sticky PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- lighthouse-a11y -->';
            const body = marker + '\n' + fs.readFileSync('a11y-comment.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
